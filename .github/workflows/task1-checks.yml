name: Task 1 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chambery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chambery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
        env:
          POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/chambery_test
      - run: bun run build
