<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9ede2">
<title>Chambery ExecOS | Interview Demo</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #e9ede2; color: #202b23; font: 1rem/1.5 system-ui, sans-serif; }
main { width: min(100%, 42rem); margin: auto; padding: 1.25rem; }
h1 { font: 3rem Georgia, serif; margin: .5rem 0; }
nav { display: flex; gap: .5rem; flex-wrap: wrap; }
button, input, textarea, select { font: inherit; max-width: 100%; }
button { min-height: 48px; padding: .65rem 1rem; border: 1px solid #4c604e; border-radius: .65rem; background: white; color: inherit; cursor: pointer; }
button[aria-current="page"], .action { background: #314838; color: white; }
.action { display: block; width: 100%; margin: .75rem 0; text-align: left; min-height: 64px; font-weight: bold; }
article, form { background: #fff; border-radius: .8rem; padding: 1rem; margin: .75rem 0; overflow-wrap: anywhere; }
label, textarea, select { display: block; margin-bottom: .6rem; }
textarea { width: 100%; }
:focus-visible { outline: 3px solid #8d4e30; outline-offset: 3px; }
main:has(.alec-home) { max-width: 27rem; min-height: 100svh; background: #0b0e0b; color: #f2f4ef; }
main:has(.alec-home) > nav, main:has(.alec-home) > p:first-child { display: none; }
.alec-home { text-align: center; }
.alec-home h2 { font-size: 1rem; font-weight: 500; }
.alec-home .action, .alec-home .manage { border-radius: 999px; text-align: center; background: #191e19; color: #f2f4ef; border-color: #626c61; }
.alec-home .call { border-color: #b4ed71; box-shadow: 0 0 14px #a7e66545; }
.alec-home .manage { width: 100%; margin-top: 1rem; }
.alec-home footer { margin-top: 1.5rem; color: #b5c4b4; font-family: Georgia, serif; }
.file-animation { position: relative; width: 11rem; height: 4.5rem; margin: 1rem 0; }
.file-animation img { position: absolute; width: 4.5rem; animation: mascot-file .85s ease-in-out both; }
.file-animation svg { position: absolute; width: 1.9rem; }
.file-animation .folder { right: .35rem; bottom: .4rem; color: #496549; }
.file-animation .envelope { left: 2.9rem; bottom: 1.05rem; color: #925529; animation: envelope-file .85s ease-in-out both; }
@keyframes mascot-file { 65%, 100% { transform: translateX(4rem); } }
@keyframes envelope-file { 65% { transform: translate(4.8rem, -.65rem); opacity: 1; } 100% { transform: translate(5.5rem, .45rem) scale(.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .file-animation { display: none; } }
.decision-card { touch-action: pan-y; }
.decision-card fieldset { margin: .6rem 0; }
</style>

const screen = document.querySelector('#screen');
const status = document.querySelector('#status');
const seed = { id: 'sample', kind: 'Decision', title: 'Approve the November briefing format', owner: 'Executive office', state: 'Needs review' };
const ready = new Promise((resolve, reject) => {
  const request = indexedDB.open('chambery-interview-demo-v1', 1);
  request.onupgradeneeded = () => {
    request.result.createObjectStore('work', { keyPath: 'id' }).add(seed);
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
async function records() {
  const db = await ready;
  return new Promise((resolve, reject) => {
    const request = db.transaction('work').objectStore('work').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function save(record, changes) {
  const db = await ready;
  return new Promise((resolve, reject) => {
    const transaction = db.transaction('work', 'readwrite');
    const store = transaction.objectStore('work');
    if (changes) {
      const request = store.get(record.id);
      request.onsuccess = () => store.put({ ...request.result, ...changes });
    } else {
      store.put(record);
    }
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
  });
}

let renderVersion = 0;
const passedThisReview = new Set();

  if (next === 'decisions' && view !== next) passedThisReview.clear();

}

async function render() {
  const version = ++renderVersion;
  document.querySelectorAll('nav button').forEach(button => {
    if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  if (view === 'alec') {
    screen.innerHTML = '<div class="alec-home"><small>INTERVIEW DEMO</small><h1>Alec</h1><h2>Your Work</h2><button class="action" data-next="decisions">Decisions, Decisions</button><button class="action call" data-next="call">Call Alec</button><button class="action" data-next="dump">Doc Dump</button><button class="manage" data-next="accountability">Manage Alec</button><footer>Chambery.</footer></div>';
    screen.querySelectorAll('[data-next]').forEach(button => {
      button.onclick = () => open(button.dataset.next);
    });
    return;
  }
  if (view === 'call-setup' || view === 'needs-review') {
    const items = await records();
    if (version !== renderVersion) return;
    if (view === 'needs-review') {
      screen.innerHTML = '<h1>Needs Review</h1><p>Demo events Alec has brought to your queue.</p>';
      const queued = items.filter(item => item.kind === 'Call event' && item.state === 'Needs review');
      if (!queued.length) screen.insertAdjacentHTML('beforeend', '<p>Nothing needs review yet.</p>');
      for (const item of queued) {
        const card = document.createElement('article');
        const title = document.createElement('h2');
        title.textContent = item.title;
        card.append(title);
        const reason = document.createElement('p');
        reason.textContent = item.routeReason ?? 'No callback rule matched when this event was routed.';
        card.append(reason);
        screen.append(card);
      }
      return;
    }
    const settings = items.find(item => item.id === 'call-settings');
    screen.innerHTML = '<h1>Call me setup</h1><p>Alec calls for selected events. Other events go to Needs Review. This demo records the route without placing a call.</p><form id="call-rules"><fieldset><legend>Call me when…</legend><label><input type="checkbox" name="flight"> A flight is interrupted</label><label><input type="checkbox" name="meeting"> A meeting is canceled</label><p>A VIP emails me. Choose demo contacts:</p><label><input type="checkbox" name="jordan"> Jordan Lee</label><label><input type="checkbox" name="casey"> Casey Chen</label></fieldset><label>How Alec briefs me<select name="style"><option value="headline">Headline and recommendation</option><option value="context">Context and options</option></select></label><button>Save preferences</button></form><h2>Try a demo event</h2><form id="call-event"><label>Sample event<select name="scenario"><option value="flight">Flight interruption</option><option value="meeting">Meeting cancellation</option><option value="jordan">Email from Jordan Lee</option><option value="casey">Email from Casey Chen</option></select></label><button>Route demo event</button></form>';
    const rules = screen.querySelector('#call-rules');
    for (const key of ['flight', 'meeting', 'jordan', 'casey']) {
      rules.elements.namedItem(key).checked = settings?.selected.includes(key) ?? false;
    }
    const style = rules.elements.namedItem('style');
    style.value = settings?.style ?? 'headline';
    rules.onsubmit = async event => {
      event.preventDefault();
      const data = new FormData(rules);
      const selected = ['flight', 'meeting', 'jordan', 'casey'].filter(key => data.has(key));
      try {
        await save({ id: 'call-settings', kind: 'Call settings', selected, style: style.value });
        if (version === renderVersion) status.textContent = 'Preferences saved.';
      } catch {
        if (version === renderVersion) status.textContent = 'Could not save preferences.';
      }
    };
    const sample = screen.querySelector('#call-event');
    sample.onsubmit = async event => {
      event.preventDefault();
      const select = sample.elements.namedItem('scenario');
      const scenario = select.value;
      const title = select.selectedOptions[0].textContent;
      const button = sample.querySelector('button');
      button.disabled = true;
      try {
        const preferences = (await records()).find(item => item.id === 'call-settings');
        const callback = preferences?.selected.includes(scenario) ?? false;
        const rule = { flight: 'flight interruptions', meeting: 'meeting cancellations', jordan: 'emails from Jordan Lee', casey: 'emails from Casey Chen' }[scenario];
        const routeReason = preferences
          ? 'Your saved Call me preferences ' + (callback ? 'include ' : 'do not include ') + rule + '.'
          : 'You haven’t saved any Call me preferences yet.';
        await save({ id: crypto.randomUUID(), kind: 'Call event', title, owner: 'Alec', routeReason, state: callback ? 'Callback selected · demo' : 'Needs review' });
        if (version === renderVersion) {
          status.textContent = callback ? 'Would call you. No call placed in this demo. ' + routeReason : 'Added to Needs Review. ' + routeReason;
        }
      } catch {
        if (version === renderVersion) status.textContent = 'Could not route the demo event.';
      } finally {
        button.disabled = false;
      }
    };
    return;
  }
  if (view === 'call') {
    screen.innerHTML = '<h1>Call Alec</h1><p>Voice assistant preview. Live calling is unavailable in this demo.</p>';
    return;
  }
  if (view === 'dump') {
    screen.innerHTML = '<h1>Doc Dump</h1><p>Use a synthetic document for this demo.</p><form><label for="file">Document</label><input id="file" type="file" required><p><button>Drop document</button></p></form>';
    const form = screen.querySelector('form');
    form.onsubmit = async event => {
      event.preventDefault();
      const file = form.querySelector('input').files[0];
      const button = form.querySelector('button');
      status.textContent = '';
      button.disabled = true;
      try {
        if (file.size > 10 * 1024 * 1024) throw new Error('Choose a file up to 10 MB.');
        const sample = file.type.startsWith('text/') || /\.(txt|csv|md)$/i.test(file.name)
          ? await file.slice(0, 65536).text() : '';
        const invoice = /\binvoice\b/i.test(sample);
        const receipt = /\breceipt\b/i.test(sample);
        const meeting = /\b(meeting|agenda|minutes|board prep|budget review)\b/i.test(sample);
        const budget = /\bbudget review\b/i.test(sample);
        const board = /\bboard prep\b/i.test(sample);
        const suggestion = meeting
          ? (budget === board ? 'Meeting clarification' : budget ? 'Budget review' : 'Board prep')
          : invoice === receipt ? 'Manual review' : invoice ? 'Possible invoice' : 'Possible receipt';
        const record = { id: crypto.randomUUID(), kind: 'Document', title: file.name, owner: 'Desktop reviewer', state: 'Intake complete', suggestion, file };
        if (suggestion === 'Meeting clarification' && version === renderVersion) {
          screen.innerHTML = '<h1>Doc Dump</h1><form><fieldset><legend>Is this for the budget review or board prep?</legend><label><input type="radio" name="meeting" value="Budget review" required> Budget review</label><label><input type="radio" name="meeting" value="Board prep"> Board prep</label></fieldset><button>Continue</button></form>';
          const question = screen.querySelector('form');
          question.onsubmit = async event => {
            event.preventDefault();
            const submit = question.querySelector('button');
            submit.disabled = true;
            try {
              await save({ ...record, suggestion: new FormData(question).get('meeting') });
              if (version === renderVersion) {
                open('dump');
                showIntakeComplete();
              }
            } catch {
              if (version === renderVersion) status.textContent = 'Could not save the document. Try again.';
              submit.disabled = false;
            }
          };
          return;
        }
        if (suggestion === 'Meeting clarification') return;
        await save({ ...record, state: suggestion === 'Manual review' ? 'Queued for review' : record.state });
        if (version === renderVersion) {
          form.reset();
          showIntakeComplete();
        }
      } catch (error) {
        if (view === 'dump') status.textContent = error.message || 'Could not save the document.';
      } finally {
        button.disabled = false;
      }
    };
    return;
  }
  const titles = { decisions: 'Decisions, Decisions', executive: 'ExecOS Executive Mobile', desktop: 'Desktop Review', accountability: 'Manage Alec' };
  screen.innerHTML = '<h1></h1><p>Shared demo records in this browser.</p>';
  screen.querySelector('h1').textContent = titles[view];
  if (view === 'decisions') {
    screen.insertAdjacentHTML('beforeend', '<p>Choose a response or Bunt to hand off the decision.</p>');
  }
  const items = await records();
  if (version !== renderVersion) return;
  if (view === 'accountability') {
    screen.insertAdjacentHTML('beforeend', '<h2>Alec’s Work</h2>');
  }
  const now = new Date();
  const today = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-');
  const visibleItems = view === 'decisions'
    ? items.filter(item => item.kind === 'Decision' && !item.disposition &&
        !passedThisReview.has(item.id) && (!item.revisitDate || item.revisitDate <= today)).slice(0, 1)
    : items.filter(item => item.kind !== 'Call settings');
  if (view === 'decisions' && !visibleItems.length) {
    screen.insertAdjacentHTML('beforeend', '<p>No more decisions in this review.</p>');
  }
  for (const item of visibleItems) {
    if ((view === 'executive' || view === 'decisions') && item.kind !== 'Decision') continue;
    const card = document.createElement('article');
    const heading = document.createElement('h2');
    heading.textContent = item.title;
    const detail = document.createElement('p');
    detail.textContent = [item.kind, item.state, item.owner, item.suggestion].filter(Boolean).join(' · ');
    card.append(heading, detail);
    if (item.note) {
      const note = document.createElement('p');
      note.textContent = item.note;
      card.append(note);
    }
    if (item.kind === 'Decision' && view === 'decisions') {
      const label = document.createElement('label');
      label.textContent = 'Decision note';
      const input = document.createElement('textarea');
      input.maxLength = 1000;
      input.value = item.note || '';
      label.append(input);
      const button = document.createElement('button');
      button.textContent = 'Save note';
      button.onclick = async () => {
        button.disabled = true;
        try {
          await save(item, { note: input.value.trim() });
          open('decisions');
          status.textContent = 'Decision note saved.';
        } catch {
          status.textContent = 'Could not save the note.';
          button.disabled = false;
        }
      };
      card.append(label, button);
    }
    if (view === 'decisions') {
      card.classList.add('decision-card');
      const pass = document.createElement('button');
      pass.textContent = 'Pass for now';
      const panel = document.createElement('form');
      panel.hidden = true;
      panel.innerHTML = '<button type="button">Next review</button><label>Revisit date<input type="date" required></label><label><input type="checkbox" checked> Include sender in demo update</label><button>Save revisit date</button><p>Demo only. No messages are sent.</p>';
      const date = panel.querySelector('input[type=date]');
      date.min = today;
      const nextReview = panel.querySelector('button');
      const submit = panel.querySelector('button[type=submit], button:not([type])');
      const reveal = () => {
        panel.hidden = false;
        nextReview.focus();
      };
      pass.onclick = reveal;
      nextReview.onclick = () => {
        passedThisReview.add(item.id);
        open('decisions');
      };
      panel.onsubmit = async event => {
        event.preventDefault();
        nextReview.disabled = true;
        submit.disabled = true;
        try {
          await save(item, { revisitDate: date.value, updateSender: panel.querySelector('input[type=checkbox]').checked });
          passedThisReview.add(item.id);
          if (version === renderVersion) open('decisions');
        } catch {
          if (version === renderVersion) status.textContent = 'Could not save the revisit date.';
          nextReview.disabled = false;
          submit.disabled = false;
        }
      };
      let start;
      card.addEventListener('touchstart', event => {
        start = event.touches.length === 1 && !event.target.closest('button, input, select, textarea, label')
          ? event.touches[0] : undefined;
      }, { passive: true });
      card.addEventListener('touchcancel', () => { start = undefined; });
      card.addEventListener('touchend', event => {
        const end = event.changedTouches[0];
        if (start && start.clientX - end.clientX > 60 && Math.abs(start.clientY - end.clientY) < 35) reveal();
        start = undefined;
      }, { passive: true });
      card.append(pass, panel);
    }
    if (item.kind === 'Decision' && view === 'decisions' && !item.disposition) {
      const form = document.createElement('form');
      form.innerHTML = '<label>Response<select required><option value="">Choose an option</option><option>Use a one-page briefing</option><option>Use the full briefing</option><option>Bunt</option></select></label><div></div><button>Save response</button><p>Demo only. Saves locally without sending messages or invitations.</p>';
      const choice = form.querySelector('select');
      const fields = form.querySelector('div');
      const button = form.querySelector('button');
      choice.onchange = () => {
        fields.innerHTML = choice.value === 'Bunt'
          ? '<label>Bunt to<select required><option value="">Choose a handoff</option><option>Pick a date to discuss</option><option>Delegate</option><option>Send back with instructions</option></select></label><section></section>'
          : '';
        const action = fields.querySelector('select');
        if (!action) return;
        action.onchange = () => {
          const details = fields.querySelector('section');
          const note = '<label>Note<textarea maxlength="1000"></textarea></label>';
          const sender = '<p>Original sender: Jordan Lee (demo)</p>';
          switch (action.value) {
            case 'Pick a date to discuss':
              details.innerHTML = '<label>Discussion date<input type="date" required></label><p>Copy: Jordan Lee (demo)</p>' + note;
              break;
            case 'Delegate':
              details.innerHTML = '<label>Demo contact<select required><option value="">Choose a contact</option><option>Casey Chen</option><option>Riley Morgan</option></select></label>' + note;
              break;
            case 'Send back with instructions':
              details.innerHTML = sender + note.replace('<textarea', '<textarea required');
              break;
            default:
              details.replaceChildren();
          }
        };
      };
      form.onsubmit = async event => {
        event.preventDefault();
        const [action, contact] = fields.querySelectorAll('select');
        const date = fields.querySelector('input')?.value;
        const note = fields.querySelector('textarea')?.value.trim();
        if (action?.value === 'Send back with instructions' && !note) {
          status.textContent = 'Add instructions for the sender.';
          return;
        }
        const owner = contact?.value || (action?.value ? 'Jordan Lee (demo)' : item.owner);
        const disposition = [choice.value, action?.value, date, note].filter(Boolean).join(' · ');
        if (!window.confirm('Save this demo response?\n\n' + disposition + '\nOwner: ' + owner)) return;
        button.disabled = true;
        try {
          await save(item, { disposition, owner, state: action?.value ? 'Bunted · handoff saved' : 'Response saved' });
          if (version === renderVersion) open('accountability');
        } catch {
          if (version === renderVersion) status.textContent = 'Could not save the response.';
          button.disabled = false;
        }
      };
      card.append(form);
    }
    if (item.disposition) {
      const outcome = document.createElement('p');
      outcome.textContent = item.disposition;
      card.append(outcome);
    }
    if (item.reply) {
      const reply = document.createElement('p');
      reply.textContent = 'Executive reply: ' + item.reply;
      card.append(reply);
    }
    if (view === 'executive' && !item.reply) {
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.textContent = 'Executive reply';
      const input = document.createElement('textarea');
      input.required = true;
      input.maxLength = 1000;
      label.append(input);
      const button = document.createElement('button');
      button.textContent = 'Save reply for review';
      form.append(label, button);
      form.onsubmit = async event => {
        event.preventDefault();
        const reply = input.value.trim();
        if (!reply) {
          status.textContent = 'Enter a reply before saving.';
          return;
        }
        button.disabled = true;
        try {
          await save(item, { reply, state: 'Awaiting assistant review' });
          if (version === renderVersion) {
            open('executive');
            status.textContent = 'Reply saved for review in this browser.';
          }
        } catch {
          if (version === renderVersion) status.textContent = 'Could not save the reply.';
          button.disabled = false;
        }
      };
      card.append(form);
    }
    if (item.file && view === 'desktop') {
      const button = document.createElement('button');
      button.textContent = 'Download saved document';
      button.onclick = () => {
        const url = URL.createObjectURL(item.file);
        const link = document.createElement('a');
        link.href = url;
        link.download = item.title;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      card.append(button);
    }
    screen.append(card);
  }
}
open('alec');
</script>
</html>
