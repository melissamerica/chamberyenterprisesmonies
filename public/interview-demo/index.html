<html lang="en">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #e9ede2; color: #202b23; font: 1rem/1.5 system-ui, sans-serif; }
main { width: min(100%, 42rem); margin: auto; padding: 1.25rem; }
h1 { font: 3rem Georgia, serif; margin: .5rem 0; }
nav { display: flex; gap: .5rem; flex-wrap: wrap; }
button, input, textarea, select { font: inherit; max-width: 100%; }
button { min-height: 48px; padding: .65rem 1rem; border: 1px solid #4c604e; border-radius: .65rem; background: white; color: inherit; cursor: pointer; }
button[aria-current="page"], .action { background: #314838; color: white; }
.action { display: block; width: 100%; margin: .75rem 0; text-align: left; min-height: 64px; font-weight: bold; }
article, form { background: #fff; border-radius: .8rem; padding: 1rem; margin: .75rem 0; overflow-wrap: anywhere; }
label, textarea, select { display: block; margin-bottom: .6rem; }
textarea { width: 100%; }
:focus-visible { outline: 3px solid #8d4e30; outline-offset: 3px; }
main:has(.alec-home) { max-width: 27rem; min-height: 100svh; background: #0b0e0b; color: #f2f4ef; }
main:has(.alec-home) > p:first-child { display: none; }
.alec-home { text-align: center; }
.alec-home h2 { font-size: 1rem; font-weight: 500; }
.alec-home .action, .alec-home .manage { border-radius: 999px; text-align: center; background: #191e19; color: #f2f4ef; border-color: #626c61; }
.alec-home .call { border-color: #b4ed71; box-shadow: 0 0 14px #a7e66545; }
.alec-home .manage { width: 100%; margin-top: 1rem; }
.alec-home footer { margin-top: 1.5rem; color: #b5c4b4; font-family: Georgia, serif; }
.file-animation { position: relative; width: 11rem; height: 4.5rem; margin: 1rem 0; }
.file-animation img { position: absolute; width: 4.5rem; animation: mascot-file .85s ease-in-out both; }
.file-animation svg { position: absolute; width: 1.9rem; }
.file-animation .folder { right: .35rem; bottom: .4rem; color: #496549; }
.file-animation .envelope { left: 2.9rem; bottom: 1.05rem; color: #925529; animation: envelope-file .85s ease-in-out both; }
@keyframes mascot-file { 65%, 100% { transform: translateX(4rem); } }
@keyframes envelope-file { 65% { transform: translate(4.8rem, -.65rem); opacity: 1; } 100% { transform: translate(5.5rem, .45rem) scale(.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .file-animation { display: none; } }
.decision-card { touch-action: pan-y; }
.decision-card fieldset { margin: .6rem 0; }
main:has(.desktop-workspace) { max-width: 76rem; }
.desktop-workspace { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border:1px solid #566956; margin-top:1rem; }
.desktop-workspace section { padding:clamp(1rem,4vw,3rem); }
.desktop-workspace section:first-child { background:#f8f1e5; }
.desktop-workspace section:last-child { background:#dbe4d5; border-left:1px solid #566956; }
.desktop-workspace h2 { font:2.2rem Georgia,serif; }
.desktop-workspace svg { display:block; width:100%; height:9rem; color:#576453; }
.desktop-workspace button { display:block; margin:.6rem 0; }
@media(max-width:640px) { .desktop-workspace {grid-template-columns:1fr;} .desktop-workspace section:last-child {border-left:0;border-top:1px solid #566956;} }
@media (min-width:641px) {
  .desktop-workspace { border:0; }
  .desktop-workspace section { position:relative; border:1px solid #566956; }
  .desktop-workspace section:first-child { z-index:1; border-right:0; animation:puzzle-left .55s ease-out both; }
  .desktop-workspace section:last-child { animation:puzzle-right .55s ease-out both; }
  .desktop-workspace section:first-child::after {
    content:""; position:absolute; top:36%; right:-1.2rem; width:1.25rem; height:2.45rem;
    border:1px solid #566956; border-left:0; border-radius:0 100% 100% 0; background:#f8f1e5;
    pointer-events:none;
  }
}
@keyframes puzzle-left { from { transform:translateX(-.8rem); } }
@keyframes puzzle-right { from { transform:translateX(.8rem); } }
@media (prefers-reduced-motion:reduce) {
  .desktop-workspace section:first-child, .desktop-workspace section:last-child { animation:none; }
}
main:has(.workspace-picker) { max-width:76rem; }
main:has(.workspace-picker) > nav, main:has(.workspace-picker) > p:first-child { display:none; }
.workspace-picker { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); min-height:calc(100svh - 2.5rem); }
.workspace-picker button { border-radius:0; font:clamp(1.2rem,4vw,2.4rem) Georgia,serif; padding:.65rem; }
.workspace-picker button:first-child { background:#f8f1e5; border-right:0; }
.workspace-picker button:last-child { background:#dbe4d5; }
:root {
  --chambery-cream: oklch(0.985 0.005 75);

body { background:var(--chambery-cream); color:var(--chambery-ink); font-family:Figtree,system-ui,sans-serif; }
h1, .workspace-picker button { font-family:Marcellus,Optima,Georgia,serif; }
main:has(.mobile-picker) { max-width:34rem; padding:0; }
.mobile-picker {

  background:var(--chambery-cream);

.mobile-picker button {

  transition:filter .2s ease;

.mobile-picker button:first-child {

.mobile-picker button:last-child {
  color:var(--chambery-cream);
  border-left:1px solid oklch(0.78 0.065 116);
  background:radial-gradient(ellipse at 86% 18%,oklch(0.56 0.105 126),transparent 62%),
    linear-gradient(153deg,oklch(0.39 0.075 142),oklch(0.23 0.038 150));
}
.mobile-picker button::before {
  content:""; position:absolute; z-index:-1; inset:1rem .65rem;
  border:1px solid currentColor; opacity:.14; pointer-events:none;
}
.mobile-picker img {
  width:clamp(3rem,13vw,4.2rem); height:clamp(3rem,13vw,4.2rem);
  object-fit:cover; border-radius:50%; border:2px solid var(--chambery-cream);
  box-shadow:0 8px 20px #17261d35;
}
.mobile-picker button:first-child img { outline:1px solid oklch(0.74 0.07 345); }
.mobile-picker button:hover { filter:brightness(1.06); }
.mobile-picker button:active { filter:brightness(.93); }
.mobile-picker button:focus-visible { outline:3px solid currentColor; outline-offset:-7px; }
@media (prefers-reduced-motion:reduce) { .mobile-picker button { transition:none; } }
.my-work { max-width:30rem; margin:auto; padding:1rem 0; }
.my-work header { margin:1.8rem 0 1.25rem; }
.my-work h1 { margin:.25rem 0; font-size:clamp(2.4rem,9vw,3.4rem); }

.my-work .work-tile span:first-child { display:grid; place-items:center; flex:none; width:2.6rem; height:2.6rem; border-radius:.75rem; background:var(--chambery-blush); }

const screen = document.querySelector('#screen');
const status = document.querySelector('#status');
const seed = { id: 'sample', kind: 'Decision', title: 'Approve the November briefing format', owner: 'Executive office', state: 'Needs review' };
const ready = new Promise((resolve, reject) => {
  const request = indexedDB.open('chambery-interview-demo-v1', 1);
  request.onupgradeneeded = () => {
    request.result.createObjectStore('work', { keyPath: 'id' }).add(seed);
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
async function records() {
  const db = await ready;
  return new Promise((resolve, reject) => {
    const request = db.transaction('work').objectStore('work').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function save(record, changes) {
  const db = await ready;
  return new Promise((resolve, reject) => {
    const transaction = db.transaction('work', 'readwrite');
    const store = transaction.objectStore('work');
    if (changes) {
      const request = store.get(record.id);
      request.onsuccess = () => store.put({ ...request.result, ...changes });
    } else {
      store.put(record);
    }
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(transaction.error);
  });
}

              selectedSolution: choice.value === 'Reply to sender' ? item.selectedSolution : choice.value,
              responseNote: note,
              state: 'Reply received'
            });
            if (version === renderVersion) {
              open('decisions');
              status.textContent = 'Reply saved for the sender in this demo.';
            }
          } catch {
            if (version === renderVersion) status.textContent = 'Could not save the reply.';
            button.disabled = false;
          }
          return;
        }
        const disposition = [choice.value, action?.value, date, note].filter(Boolean).join(' · ');
        if (!window.confirm('Save this demo response?\n\n' + disposition + '\nOwner: ' + owner)) return;
        button.disabled = true;
        try {
          const holder = date ? actor : owner;
          await save(item, { disposition, holder, from: date ? originalSender : actor, owner: holder, revisitDate: date || null, state: 'Bunted · handoff saved',
            history: [...(item.history ?? []), { actor, text: disposition }] });
          if (date) passedThisReview.add(item.id);
          if (version === renderVersion) open('accountability');
        } catch {
          if (version === renderVersion) status.textContent = 'Could not save the response.';
          button.disabled = false;
        }
      };
      card.append(form);
    }
    if (item.disposition) {
      const outcome = document.createElement('p');
      outcome.textContent = item.disposition;
      card.append(outcome);
    }
    if (item.reply) {
      const reply = document.createElement('p');
      reply.textContent = 'Executive reply: ' + item.reply;
      card.append(reply);
    }
    if (view === 'executive' && !item.reply) {
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.textContent = 'Executive reply';
      const input = document.createElement('textarea');
      input.required = true;
      input.maxLength = 1000;
      label.append(input);
      const button = document.createElement('button');
      button.textContent = 'Save reply for review';
      form.append(label, button);
      form.onsubmit = async event => {
        event.preventDefault();
        const reply = input.value.trim();
        if (!reply) {
          status.textContent = 'Enter a reply before saving.';
          return;
        }
        button.disabled = true;
        try {
          await save(item, { reply, state: 'Awaiting assistant review' });
          if (version === renderVersion) {
            open('executive');
            status.textContent = 'Reply saved for review in this browser.';
          }
        } catch {
          if (version === renderVersion) status.textContent = 'Could not save the reply.';
          button.disabled = false;
        }
      };
      card.append(form);
    }
    if (item.file && view === 'desktop') {
      const button = document.createElement('button');
      button.textContent = 'Download saved document';
      button.onclick = () => {
        const url = URL.createObjectURL(item.file);
        const link = document.createElement('a');
        link.href = url;
        link.download = item.title;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      card.append(button);
    }
    screen.append(card);
  }
}
open(entryView);
</script>
</html>
